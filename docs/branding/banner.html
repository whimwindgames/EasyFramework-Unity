<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1280px; height:640px; }
  .banner {
    width:1280px; height:640px; background:#0d1117; overflow:hidden;
    padding:96px 104px; display:flex; flex-direction:column; justify-content:center;
    font-family:-apple-system,"PingFang SC","Helvetica Neue",Arial,sans-serif;
    color:#f0f6fc;
  }
  .toprow { display:flex; align-items:center; gap:20px; margin-bottom:14px; }
  .logo { width:64px; height:64px; border-radius:15px; background:#2dd4bf;
    display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
  .kicker { font-size:18px; letter-spacing:3px; color:#7d8590; text-transform:uppercase; }
  .title { font-size:88px; font-weight:600; color:#f0f6fc; line-height:1.02; margin:4px 0 10px; letter-spacing:-1px; }
  .subtitle { font-size:34px; color:#c9d1d9; font-weight:400; margin-bottom:10px; }
  .tagline { font-size:19px; color:#7d8590; margin-bottom:34px; letter-spacing:0.3px; }
  .chips { display:flex; flex-wrap:wrap; gap:13px; }
  .chip { font-size:20px; padding:8px 20px; border-radius:30px; }
  .c1 { color:#7ee7d8; background:rgba(45,212,191,0.12); border:1px solid rgba(45,212,191,0.32); }
  .c2 { color:#a5d6ff; background:rgba(56,139,253,0.12); border:1px solid rgba(56,139,253,0.32); }
  .c3 { color:#d2a8ff; background:rgba(163,113,247,0.12); border:1px solid rgba(163,113,247,0.32); }
  .c4 { color:#ffd9a8; background:rgba(240,180,80,0.12); border:1px solid rgba(240,180,80,0.32); }
</style>
</head>
<body>
<div class="banner">
  <div class="toprow">
    <div class="logo">
      <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#0d1117" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M13 3L4 14h7l-1 7l9-11h-7z" fill="#0d1117" stroke="none"/>
      </svg>
    </div>
    <span class="kicker">Unity 6 · iOS / Android</span>
  </div>
  <div class="title">EasyFramework</div>
  <div class="subtitle">开箱即用的 Unity 2D 移动游戏框架</div>
  <div class="tagline">DI core · full service &amp; monetization layers · 137 tests green</div>
  <div class="chips">
    <span class="chip c1">VContainer DI 内核</span>
    <span class="chip c2">17 服务模块</span>
    <span class="chip c3">广告 · 内购 · 统计</span>
    <span class="chip c4">对象池 · 状态机 · 存档</span>
  </div>
</div>
</body>
</html>
